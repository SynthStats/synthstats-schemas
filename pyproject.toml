[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synthstats-schemas"
version = "0.20.0"
description = "Shared Pydantic schemas for SynthStats reward provenance and trace evidence."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
# Harbor supplies the ATIF models re-exported by this package.
dependencies = ["pydantic>=2.12", "harbor==0.25.0"]

[project.optional-dependencies]
test = ["pytest>=8"]
validation = ["jsonschema>=4.18"]
wandb = ["wandb>=0.30"]  # The probe needs the service API introduced in 0.30.

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
