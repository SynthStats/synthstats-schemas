[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synthstats-schemas"
version = "0.8.0"
license = "MIT"
description = "Shared Pydantic schemas for SynthStats reward provenance and trace evidence."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2"]

[project.optional-dependencies]
test = ["pytest>=8"]
wandb = ["wandb>=0.30"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
