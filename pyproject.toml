[build-system]
requires = ["setuptools==84.2.1", "setuptools-scm==10.3.4"]
build-backend = "setuptools.build_meta"

[project]
name = "synthstats-schemas"
dynamic = ["version"]
description = "Shared Pydantic schemas for SynthStats reward provenance and trace evidence."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
# Harbor supplies the ATIF models re-exported by this package.
dependencies = ["pydantic>=2.12", "harbor==0.25.0"]

[project.optional-dependencies]
test = [
    "hypothesis>=6.160.0",
    "jsonschema>=4.18",
    "pytest>=8",
]
validation = ["jsonschema>=4.18"]

[tool.setuptools_scm]
fallback_version = "0.0.0+unknown"

[tool.towncrier]
directory = "changes"
filename = "CHANGELOG.md"
template = "template.md.jinja"
package_dir = "src"
start_string = "<!-- towncrier release notes start -->\n"

[[tool.towncrier.type]]
directory = "terms"
name = "Terms"

[[tool.towncrier.type]]
directory = "added"
name = "Added"

[[tool.towncrier.type]]
directory = "changed"
name = "Changed"

[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"

[[tool.towncrier.type]]
directory = "removed"
name = "Removed"

[[tool.towncrier.type]]
directory = "examples"
name = "Examples"


[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
